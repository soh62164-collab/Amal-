<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>আমল ট্র্যাকার</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#12302c;--mut:#6b8581;--pr:#0f766e;--ok:#16a34a;--bd:#d9e5e2}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a18;--card:#162825;--tx:#e6f2ef;--mut:#8fb0aa;--pr:#2dd4bf;--ok:#4ade80;--bd:#27403c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
.w{max-width:560px;margin:auto;padding:12px}
h1{font-size:20px;margin:8px 0}
.tabs{display:flex;gap:8px;margin:8px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on,.chip.on,.day.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;font:inherit}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 0;font:inherit;font-size:12px;text-align:center}
.day b{display:block;font-size:15px}
.day.ok{background:rgba(22,163,74,.22);border-color:var(--ok)}
.day.bad{background:rgba(220,38,38,.2);border-color:#dc2626}
.day.on.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.day:disabled{cursor:default}
.day.bad i s{background:#dc2626}
.wavg{display:flex;justify-content:space-around;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.wavg div{font-size:13px;color:var(--mut)}.wavg b{display:block;font-size:22px;color:var(--tx)}
.day i{display:block;height:4px;margin:4px 6px 0;border-radius:2px;background:var(--bd);overflow:hidden}
.day i s{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nm{font-weight:600}.sub{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:8px 0;overflow:hidden}
.bar s{display:block;height:100%;background:var(--pr)}
.card.done .bar s{background:var(--ok)}.card.done .nm::after{content:" ✓";color:var(--ok)}
.ctl{display:flex;align-items:center;gap:10px}
.ctl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.ctl button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.ctl span{min-width:34px;text-align:center;font-size:18px;font-weight:700}
.sm{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
.sm.d{color:#dc2626}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{flex:1 1 120px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.add input.n{flex:0 0 80px}
.add button{padding:10px 16px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit}
.sum{text-align:center;font-size:15px}
.emp{text-align:center;color:var(--mut);padding:20px}
</style>
</head>
<body>
<div class="w">
  <h1>🌙 আমল ট্র্যাকার</h1>
  <div class="tabs"><button id="t-amal">দৈনিক আমল</button><button id="t-post">নামাজের পর আমল</button></div>
  <div class="nav"><button id="prev">‹ আগের সপ্তাহ</button><span id="wk" class="sub"></span><button id="next">পরের সপ্তাহ ›</button></div>
  <div class="strip" id="strip"></div>
  <div class="chips" id="chips"></div>
  <div class="card sum" id="sum"></div>
  <div id="list"></div>
  <div class="row"><span class="sub">আমলের তালিকা পরিবর্তন করুন</span><button class="sm" id="edt">✏️ সম্পাদনা</button></div>
  <div class="card add" id="addbox" hidden>
    <input id="an" placeholder="আমলের নাম (যেমন: কুরআন তিলাওয়াত)">
    <input id="at" class="n" type="number" min="1" value="1" placeholder="টার্গেট">
    <input id="au" class="n" placeholder="একক">
    <button id="ab">যোগ করুন</button>
  </div>
</div>
<script>
const DAYS=["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"];
const WAQT=[["fajr","ফজর"],["zuhr","যোহর"],["asr","আসর"],["maghrib","মাগরিব"],["isha","এশা"]];
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const uid=()=>Math.random().toString(36).slice(2,9);
let S;
try{S=JSON.parse(localStorage.getItem("amalApp"))}catch(e){}
S=S||{amal:[{id:uid(),n:"কুরআন তিলাওয়াত",t:2,u:"পৃষ্ঠা"},{id:uid(),n:"ইস্তিগফার",t:100,u:"বার"}],
 post:[{id:uid(),n:"সুবহানাল্লাহ",t:33,u:"বার"},{id:uid(),n:"আলহামদুলিল্লাহ",t:33,u:"বার"},{id:uid(),n:"আল্লাহু আকবার",t:34,u:"বার"}],log:{}};
S.start=S.start||key(new Date());
const save=()=>{try{localStorage.setItem("amalApp",JSON.stringify(S))}catch(e){}};
let tab="amal",waqt="fajr",edit=false,off=0,sel=key(new Date());
const $=id=>document.getElementById(id);
const sec=()=>tab==="amal"?"amal":"post_"+waqt;
const get=(d,s,id)=>((S.log[d]||{})[s]||{})[id]||0;
function set(d,s,id,v){S.log[d]=S.log[d]||{};S.log[d][s]=S.log[d][s]||{};S.log[d][s][id]=Math.max(0,v);save();}
function dayPct(d){
  const secs=tab==="amal"?["amal"]:WAQT.map(w=>"post_"+w[0]);
  const items=S[tab];if(!items.length)return 0;
  let tot=0,n=0;
  secs.forEach(s=>items.forEach(i=>{tot+=Math.min(get(d,s,i.id),i.t)/i.t;n++}));
  return Math.round(tot/n*100);
}
function weekStart(o=off){const d=new Date();const diff=(d.getDay()+1)%7;d.setDate(d.getDate()-diff+o*7);d.setHours(0,0,0,0);return d}
const todayKey=()=>key(new Date());
function weekAvg(o){const ws=weekStart(o),tk=todayKey();let t=0,n=0;
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const k=key(d);if(k>=S.start&&k<=tk){t+=dayPct(k);n++}}
  return n?Math.round(t/n):null}
function status(k,tk){const p=dayPct(k);if(k===tk)return p>=100?"ok":"";if(k<tk&&k>=S.start)return p>=100?"ok":"bad";return""}
function render(){
  const tk=todayKey();sel=tk;
  $("t-amal").className=tab==="amal"?"on":"";$("t-post").className=tab==="post"?"on":"";
  const ws=weekStart();const days=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d});
  $("wk").textContent=bn(days[0].getDate())+"/"+bn(days[0].getMonth()+1)+" – "+bn(days[6].getDate())+"/"+bn(days[6].getMonth()+1);
  $("strip").innerHTML=days.map(d=>{const k=key(d);return `<button class="day ${k===tk?"on ":""}${status(k,tk)}" ${k===tk?"":"disabled"}>${DAYS[d.getDay()]}<b>${bn(d.getDate())}</b><i><s style="width:${dayPct(k)}%"></s></i></button>`}).join("");
  $("chips").hidden=tab!=="post";
  $("chips").innerHTML=WAQT.map(w=>`<button class="chip ${w[0]===waqt?"on":""}" data-w="${w[0]}">${w[1]}</button>`).join("");
  const a=weekAvg(off),b=weekAvg(off-1),f=v=>v===null?"—":bn(v)+"%",tr=a!==null&&b!==null?(a>b?" ↑":a<b?" ↓":""):"";
  $("sum").innerHTML=`আজকের অগ্রগতি: <b>${bn(dayPct(tk))}%</b>`+(tab==="post"?` <span class="sub">(পাঁচ ওয়াক্ত মিলিয়ে)</span>`:"")+
  `<div class="wavg"><div>${off===0?"এই সপ্তাহের গড়":"এই সপ্তাহ (গড়)"}<b>${f(a)}${tr}</b></div><div>আগের সপ্তাহের গড়<b>${f(b)}</b></div></div>`;
  const s=sec(),items=S[tab];
  $("list").innerHTML=items.length?items.map(i=>{
    const c=get(sel,s,i.id),p=Math.min(100,Math.round(c/i.t*100));
    return `<div class="card ${c>=i.t?"done":""}"><div class="row"><div><div class="nm">${esc(i.n)}</div><div class="sub">টার্গেট: ${bn(i.t)} ${esc(i.u||"")}</div></div>
    <div class="ctl"><button data-m="${i.id}">−</button><span>${bn(c)}</span><button class="p" data-p="${i.id}">+</button></div></div>
    <div class="bar"><s style="width:${p}%"></s></div>
    ${edit?`<div class="row"><button class="sm" data-e="${i.id}">টার্গেট/নাম বদলান</button><button class="sm d" data-x="${i.id}">মুছুন</button></div>`:""}</div>`}).join(""):`<div class="emp">কোনো আমল নেই। "সম্পাদনা" চেপে নতুন আমল যোগ করুন।</div>`;
  $("addbox").hidden=!edit;$("edt").textContent=edit?"✅ শেষ":"✏️ সম্পাদনা";
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const D=b.dataset;
  if(b.id==="t-amal"){tab="amal"}else if(b.id==="t-post"){tab="post"}
  else if(b.id==="prev"){off--}else if(b.id==="next"){if(off<0)off++}
  else if(b.id==="edt"){edit=!edit}
  else if(D.w){waqt=D.w}
  else if(D.p){set(sel,sec(),D.p,get(sel,sec(),D.p)+1)}
  else if(D.m){set(sel,sec(),D.m,get(sel,sec(),D.m)-1)}
  else if(D.x){if(confirm("এই আমলটি তালিকা থেকে বাদ দেবেন?"))S[tab]=S[tab].filter(i=>i.id!==D.x),save()}
  else if(D.e){const i=S[tab].find(i=>i.id===D.e);const n=prompt("আমলের নাম",i.n);if(n&&n.trim())i.n=n.trim();const t=parseInt(prompt("নতুন টার্গেট",i.t));if(t>0)i.t=t;save()}
  else if(b.id==="ab"){const n=$("an").value.trim(),t=parseInt($("at").value);if(!n||!(t>0)){alert("নাম ও টার্গেট দিন");return}
    S[tab].push({id:uid(),n,t,u:$("au").value.trim()});save();$("an").value="";$("au").value="";$("at").value=1}
  else return;
  render();
});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
